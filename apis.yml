aid: wolt
name: Wolt
description: >-
  Wolt is a marketplace and last-mile delivery platform (part of DoorDash) operating across
  Europe and beyond. Its developer surface exposes two production APIs: the Order / Marketplace
  API, which delivers consumer orders into a merchant POS or in-store system and drives them
  through accept, ready, and delivered states with refunds and group-order support; and the
  Wolt Drive API, which provides on-demand last-mile delivery via shipment promises, delivery
  creation, courier tracking, and webhooks. Authentication is OAuth 2.0 issuing one-hour bearer
  JWTs (Wolt Drive uses a Merchant Key bearer token), with HMAC-SHA256 / HS256-JWT signed
  webhooks for order and delivery lifecycle events.

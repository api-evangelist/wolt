apis:
- name: Wolt Drive API
  description: >-
    On-demand last-mile delivery: generate binding shipment promises (price + ETA), create
    deliveries, calculate venueless delivery fees, cancel before courier acceptance, retrieve
    handshake PINs, and receive delivery-lifecycle webhooks.
  humanURL: https://developer.wolt.com/docs/wolt-drive
  baseURL: https://daas-public-api.wolt.com
  tags:
  - Delivery
  - Logistics
  - Last Mile
